<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17102f">
<title>الموازي | أحمد الطيب</title>

<style>
:root{
  --bg:#100b24;
  --bg2:#1b1240;
  --card:#21164a;
  --card2:#2a1d58;
  --text:#ffffff;
  --muted:#b9b1d2;
  --line:#ffffff18;
  --accent:#8b5cf6;
  --accent2:#22d3ee;
  --success:#34d399;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  padding:18px;
  font-family:Tahoma,Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 15% 10%,#50319b 0,transparent 30%),
    radial-gradient(circle at 90% 80%,#164e63 0,transparent 28%),
    linear-gradient(145deg,var(--bg),var(--bg2));
}

.wrap{
  width:100%;
  max-width:720px;
  margin:auto;
}

/* HEADER */
.top{
  text-align:center;
  padding:14px 0 25px;
}

.logo{
  width:68px;
  height:68px;
  margin:0 auto 13px;
  display:grid;
  place-items:center;
  border-radius:22px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:white;
  font-size:32px;
  font-weight:900;
  box-shadow:0 12px 35px #8b5cf655;
}

.brand h1{
  margin:0;
  font-size:38px;
  font-weight:900;
  letter-spacing:-1px;
}

.brand h2{
  margin:6px 0 0;
  font-size:21px;
  color:#e9e2ff;
  font-weight:700;
}

.brand p{
  margin:9px 0 0;
  color:var(--muted);
  font-size:13px;
}

.live{
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-top:15px;
  padding:8px 14px;
  border-radius:999px;
  color:#a7f3d0;
  background:#34d39912;
  border:1px solid #34d39944;
  font-size:12px;
}

/* MAIN CARD */
.card{
  background:linear-gradient(160deg,#2b1d59ee,#17102fee);
  border:1px solid var(--line);
  border-radius:30px;
  padding:25px;
  box-shadow:0 30px 80px #0008;
  backdrop-filter:blur(18px);
}

.hero{
  text-align:center;
  padding:5px 0 20px;
}

.hero h3{
  margin:0;
  font-size:28px;
}

.hero p{
  margin:8px 0 0;
  color:var(--muted);
  font-size:13px;
}

/* AMOUNT */
.field{
  margin-top:18px;
}

.label{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:9px;
  color:#ddd6fe;
  font-size:13px;
}

input,
select{
  width:100%;
  border:1px solid #ffffff1c;
  background:#0e0920;
  color:white;
  border-radius:17px;
  padding:17px 15px;
  font-size:18px;
  outline:none;
  transition:.2s;
}

input:focus,
select:focus{
  border-color:var(--accent2);
  box-shadow:0 0 0 3px #22d3ee18;
}

/* CURRENCIES */
.currencies{
  display:grid;
  grid-template-columns:1fr 58px 1fr;
  gap:10px;
  align-items:end;
}

.swap{
  height:55px;
  border:0;
  border-radius:17px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:white;
  font-size:25px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 8px 25px #8b5cf644;
  transition:.2s;
}

.swap:hover{
  transform:translateY(-2px);
}

.swap:active{
  transform:scale(.95);
}

/* RESULT */
.result{
  margin-top:23px;
  padding:24px 18px;
  border-radius:23px;
  text-align:center;
  background:
    linear-gradient(145deg,#8b5cf615,#22d3ee10),
    #0d0820;
  border:1px solid #8b5cf644;
}

.result .small{
  color:var(--muted);
  font-size:13px;
}

.result .value{
  margin:9px 0;
  font-size:38px;
  font-weight:900;
  color:#ffffff;
  word-break:break-word;
}

.resultText{
  line-height:1.7;
}

/* STATUS */
.status{
  margin-top:17px;
  text-align:center;
  color:#a7f3d0;
  font-size:12px;
}

/* FOOTER */
.footer{
  padding:22px 0 8px;
  text-align:center;
  color:var(--muted);
  font-size:12px;
}

.footer strong{
  color:white;
}

/* MOBILE */
@media(max-width:520px){

  body{
    padding:12px;
  }

  .top{
    padding-top:10px;
  }

  .logo{
    width:60px;
    height:60px;
    border-radius:19px;
    font-size:28px;
  }

  .brand h1{
    font-size:34px;
  }

  .brand h2{
    font-size:19px;
  }

  .card{
    padding:18px;
    border-radius:25px;
  }

  .hero h3{
    font-size:25px;
  }

  .currencies{
    grid-template-columns:minmax(0,1fr) 48px minmax(0,1fr);
  }

  input,
  select{
    padding:14px 9px;
    font-size:15px;
  }

  .swap{
    height:50px;
    font-size:22px;
  }

  .result .value{
    font-size:32px;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <!-- HEADER -->
  <div class="top">

    <div class="logo">م</div>

    <div class="brand">
      <h1>الموازي</h1>
      <h2>أحمد الطيب</h2>
      <p>أسعار العملات مقابل الجنيه السوداني</p>
    </div>

    <div class="live">
      ● الأسعار محدثة
    </div>

  </div>


  <!-- CONVERTER -->
  <div class="card">

    <div class="hero">
      <h3>محوّل العملات</h3>
      <p>حوّل بين العملات بسهولة وسرعة</p>
    </div>


    <!-- AMOUNT -->
    <div class="field">

      <div class="label">
        <span>المبلغ</span>
        <span id="rateText">جاري تحديث الأسعار...</span>
      </div>

      <input
        id="amount"
        type="number"
        value="1"
        min="0"
        step="any"
        placeholder="أدخل المبلغ"
      >

    </div>


    <!-- CURRENCIES -->
    <div class="field">

      <div class="currencies">

        <div>
          <div class="label">
            <span>من</span>
          </div>

          <select id="from"></select>
        </div>


        <button
          class="swap"
          id="swap"
          title="تبديل العملات"
        >⇄</button>


        <div>
          <div class="label">
            <span>إلى</span>
          </div>

          <select id="to"></select>
        </div>

      </div>

    </div>


    <!-- RESULT -->
    <div class="result">

      <div class="small">
        الناتج
      </div>

      <div class="value" id="result">
        —
      </div>

      <div
        class="small"
        id="resultText"
      >
        اختر العملات وأدخل المبلغ
      </div>

    </div>


    <div
      class="status"
      id="status"
    >
      جاري تحميل أسعار العملات...
    </div>

  </div>


  <!-- FOOTER -->
  <div class="footer">
    <strong>الموازي</strong> — <strong>أحمد الطيب</strong>
    <br>
    © 2026 جميع الحقوق محفوظة
  </div>

</div>


<script>

const currencies = {

  USD:"الدولار الأمريكي",
  SDG:"الجنيه السوداني",
  EUR:"اليورو",
  GBP:"الجنيه الإسترليني",
  SAR:"الريال السعودي",
  AED:"الدرهم الإماراتي",
  QAR:"الريال القطري",
  EGP:"الجنيه المصري",
  KWD:"الدينار الكويتي",
  BHD:"الدينار البحريني",
  OMR:"الريال العماني",
  JOD:"الدينار الأردني",
  TRY:"الليرة التركية",
  CNY:"اليوان الصيني",
  JPY:"الين الياباني",
  INR:"الروبية الهندية",
  ZAR:"الراند الجنوب أفريقي",
  CAD:"الدولار الكندي",
  AUD:"الدولار الأسترالي",
  CHF:"الفرنك السويسري"

};


const from = document.getElementById("from");
const to = document.getElementById("to");
const amount = document.getElementById("amount");
const result = document.getElementById("result");
const resultText = document.getElementById("resultText");
const status = document.getElementById("status");
const rateText = document.getElementById("rateText");


for(const code in currencies){

  from.add(
    new Option(
      `${currencies[code]} (${code})`,
      code
    )
  );

  to.add(
    new Option(
      `${currencies[code]} (${code})`,
      code
    )
  );

}


from.value = "USD";
to.value = "SDG";


let rates = {};


async function loadRates(){

  try{

    const response =
      await fetch(
        "https://open.er-api.com/v6/latest/USD"
      );

    const data =
      await response.json();

    if(data.result !== "success"){
      throw new Error();
    }

    rates = data.rates;

    status.textContent =
      "✓ تم تحديث أسعار العملات";

    calculate();

  }catch(e){

    status.textContent =
      "تعذر تحديث الأسعار — تحقق من الإنترنت";

    rateText.textContent = "";

  }

}


function calculate(){

  const value =
    parseFloat(amount.value) || 0;

  const a = from.value;
  const b = to.value;


  if(!rates[a] || !rates[b]){

    result.textContent = "—";

    resultText.textContent =
      "السعر غير متوفر حاليًا";

    return;

  }


  const rate =
    rates[b] / rates[a];

  const converted =
    value * rate;


  result.textContent =
    converted.toLocaleString("ar-EG",{
      maximumFractionDigits:4
    });


  resultText.textContent =
    `${value.toLocaleString("ar-EG")}
    ${a} =
    ${converted.toLocaleString("ar-EG",{
      maximumFractionDigits:4
    })}
    ${b}`;


  rateText.textContent =
    `1 ${a} = ${
      rate.toLocaleString("en-US",{
        maximumFractionDigits:6
      })
    } ${b}`;

}


amount.addEventListener(
  "input",
  calculate
);

from.addEventListener(
  "change",
  calculate
);

to.addEventListener(
  "change",
  calculate
);


document
  .getElementById("swap")
  .addEventListener("click",()=>{

    const x = from.value;

    from.value = to.value;
    to.value = x;

    calculate();

  });


loadRates();

</script>

</body>
</html>
