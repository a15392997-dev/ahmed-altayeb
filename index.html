<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>أحمد الطيب | محوّل العملات</title>

<style>
:root{
--bg:#07111f;
--card:#0d1b2d;
--card2:#10243b;
--text:#f8fafc;
--muted:#9fb0c4;
--line:#25405d;
--accent:#2dd4bf;
--accent2:#38bdf8;
}
*{box-sizing:border-box}
body{
margin:0;min-height:100vh;padding:22px;
font-family:Tahoma,Arial,sans-serif;color:var(--text);
background:radial-gradient(circle at 20% 10%,#12385a 0,#07111f 42%,#040a12 100%);
}
.wrap{max-width:680px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.brand{display:flex;gap:12px;align-items:center}
.logo{
width:48px;height:48px;border-radius:15px;display:grid;place-items:center;
background:linear-gradient(135deg,var(--accent),var(--accent2));
color:#04202a;font-weight:900;font-size:22px;
}
.brand h1{font-size:22px;margin:0}
.brand p{font-size:12px;color:var(--muted);margin:5px 0 0}
.live{
font-size:12px;color:#b7f7ee;border:1px solid #2dd4bf55;
background:#2dd4bf12;padding:8px 11px;border-radius:999px
}
.card{
background:linear-gradient(180deg,#102238dd,#0a1728ee);
border:1px solid #ffffff12;border-radius:28px;padding:24px;
box-shadow:0 25px 70px #0007;backdrop-filter:blur(12px)
}
.hero{text-align:center;padding:8px 0 18px}
.hero h2{font-size:32px;margin:0 0 8px}
.hero p{color:var(--muted);margin:0}
.field{margin-top:18px}
.label{display:flex;justify-content:space-between;font-size:13px;color:#c8d4e3;margin-bottom:8px}
input,select{
width:100%;border:1px solid var(--line);background:#071523;color:var(--text);
border-radius:16px;padding:16px;font-size:18px;outline:none
}
input:focus,select:focus{border-color:var(--accent)}
.currencies{
display:grid;grid-template-columns:1fr 56px 1fr;gap:10px;align-items:end
}
.swap{
height:54px;border:0;border-radius:16px;
background:linear-gradient(135deg,var(--accent),var(--accent2));
color:#04202a;font-size:25px;font-weight:900;cursor:pointer
}
.result{
margin-top:22px;padding:22px;border:1px solid #2dd4bf33;
border-radius:22px;background:#071523aa;text-align:center
}
.result .small{font-size:13px;color:var(--muted)}
.result .value{font-size:34px;font-weight:900;margin:8px 0}
.status{text-align:center;color:var(--muted);font-size:12px;margin-top:16px}
.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}
@media(max-width:520px){
body{padding:14px}
.card{padding:18px}
.hero h2{font-size:27px}
.currencies{grid-template-columns:1fr 48px 1fr}
input,select{padding:14px 10px;font-size:16px}
}
</style>
</head>

<body>
<div class="wrap">

<div class="top">
<div class="brand">
<div class="logo">م</div>
<div>
<h1>الموازي</h1>
<p>محول العملات — أحمد الطيب</p>
</div>
</div>
<div class="live">● مباشر</div>
</div>

<div class="card">

<div class="hero">
<h2>محول العملات</h2>
<p>حوّل بين العملات بسهولة وبأسعار محدثة</p>
</div>

<div class="field">
<div class="label">
<span>المبلغ</span>
<span id="rateText">جاري تحديث الأسعار...</span>
</div>
<input id="amount" type="number" value="1" min="0" step="any">
</div>

<div class="field">
<div class="currencies">

<div>
<div class="label"><span>من</span></div>
<select id="from"></select>
</div>

<button class="swap" id="swap" title="تبديل">⇄</button>

<div>
<div class="label"><span>إلى</span></div>
<select id="to"></select>
</div>

</div>
</div>

<div class="result">
<div class="small">الناتج</div>
<div class="value" id="result">—</div>
<div class="small" id="resultText">اختر العملات وأدخل المبلغ</div>
</div>

<div class="status" id="status">جاري تحميل أسعار العملات...</div>

</div>

<div class="footer">
© أحمد الطيب — الموازي
</div>

</div>

<script>
const currencies = {
USD:"الدولار الأمريكي",
SDG:"الجنيه السوداني",
EUR:"اليورو",
GBP:"الجنيه الإسترليني",
SAR:"الريال السعودي",
AED:"الدرهم الإماراتي",
QAR:"الريال القطري",
EGP:"الجنيه المصري",
KWD:"الدينار الكويتي",
BHD:"الدينار البحريني",
OMR:"الريال العماني",
JOD:"الدينار الأردني",
TRY:"الليرة التركية",
CNY:"اليوان الصيني",
JPY:"الين الياباني",
INR:"الروبية الهندية",
ZAR:"الراند الجنوب أفريقي",
CAD:"الدولار الكندي",
AUD:"الدولار الأسترالي",
CHF:"الفرنك السويسري"
};

const from = document.getElementById("from");
const to = document.getElementById("to");
const amount = document.getElementById("amount");
const result = document.getElementById("result");
const resultText = document.getElementById("resultText");
const status = document.getElementById("status");
const rateText = document.getElementById("rateText");

for(const code in currencies){
from.add(new Option(`${currencies[code]} (${code})`,code));
to.add(new Option(`${currencies[code]} (${code})`,code));
}

from.value="USD";
to.value="SDG";

let rates={};

async function loadRates(){
try{
const response=await fetch("https://open.er-api.com/v6/latest/USD");
const data=await response.json();

if(data.result!=="success") throw new Error();

rates=data.rates;
status.textContent="✓ تم تحديث أسعار العملات";
calculate();
}catch(e){
status.textContent="تعذر تحديث الأسعار — تحقق من الإنترنت";
rateText.textContent="";
}
}

function calculate(){
const value=parseFloat(amount.value)||0;
const a=from.value;
const b=to.value;

if(!rates[a] || !rates[b]){
result.textContent="—";
resultText.textContent="السعر غير متوفر حاليًا";
return;
}

const rate=rates[b]/rates[a];
const converted=value*rate;

result.textContent=converted.toLocaleString("ar-EG",{
maximumFractionDigits:4
});

resultText.textContent=
`${value.toLocaleString("ar-EG")} ${a} = ${converted.toLocaleString("ar-EG",{maximumFractionDigits:4})} ${b}`;

rateText.textContent=`1 ${a} = ${rate.toLocaleString("en-US",{maximumFractionDigits:6})} ${b}`;
}

amount.addEventListener("input",calculate);
from.addEventListener("change",calculate);
to.addEventListener("change",calculate);

document.getElementById("swap").addEventListener("click",()=>{
const x=from.value;
from.value=to.value;
to.value=x;
calculate();
});

loadRates();
</script>

</body>
</html>
