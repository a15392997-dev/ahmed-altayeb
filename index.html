<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<title>أحمد الطيب | محوّل العملات</title>

:root{

*{box-sizing:border-box}

body{

.wrap{

margin:auto;
}

}

.brand{

}

}

.brand p{

margin:5px 0 0;
}

.live{

color:#b7f7ee;

background:#2dd4bf12;
padding:8px 11px;

}

.card{
background:linear-gradient(180deg,#102238dd,#0a1728ee);

border-radius:28px;
padding:24px;

}

.hero{
text-align:center;
padding:8px 0 18px;
}

.hero h2{
font-size:32px;
margin:0 0 8px;
}

.hero p{
color:var(--muted);
margin:0;
}

.field{
margin-top:18px;
}

.label{
display:flex;
justify-content:space-between;
align-items:center;
font-size:13px;
color:#c8d4e3;
margin-bottom:8px;
}

input,select{
width:100%;
border:1px solid var(--line);
background:#071523;
color:var(--text);
border-radius:16px;
padding:16px;
font-size:18px;
outline:none;
}

input:focus,select:focus{
border-color:var(--accent);
}

.currencies{
display:grid;
grid-template-columns:1fr 56px 1fr;
gap:10px;
align-items:end;
}

.swap{

color:#04202a;
font-size:25px;
font-weight:900;
cursor:pointer;
}
